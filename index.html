<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSC UHAMKA Arena Survival</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- MediaPipe scripts for hand tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="debugLogBox" style="position:fixed; bottom:0; left:0; width:100%; max-height:120px; overflow-y:auto; background:rgba(0,0,0,0.9); color:#00ff00; font-family:monospace; font-size:9px; z-index:9999; padding:6px; border-top:2px solid #555;">
    <strong>Console Debug:</strong> <button onclick="document.getElementById('debugLogBox').style.display='none'" style="float:right; padding:2px 5px; font-size:8px; border:1px solid #ff5555; background:#aa0000; color:white; cursor:pointer;">Close</button>
    <div id="debugLogContent" style="margin-top:5px; line-height:1.2; font-family:monospace;"></div>
</div>
<script>
(function() {
    const logBox = document.getElementById('debugLogContent');
    function log(msg, type = 'log') {
        if (!logBox) return;
        const div = document.createElement('div');
        div.style.color = type === 'error' ? '#ff5555' : (type === 'warn' ? '#ffaa00' : '#00ff00');
        div.textContent = `[${type.toUpperCase()}] ${msg}`;
        logBox.appendChild(div);
        logBox.scrollTop = logBox.scrollHeight;
    }
    const _log = console.log;
    const _error = console.error;
    const _warn = console.warn;
    console.log = function(...args) { _log.apply(console, args); log(args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' '), 'log'); };
    console.error = function(...args) { _error.apply(console, args); log(args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' '), 'error'); };
    console.warn = function(...args) { _warn.apply(console, args); log(args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' '), 'warn'); };
    window.onerror = function(message, source, lineno, colno, error) { log(`${message} at ${source}:${lineno}:${colno}`, 'error'); return false; };
    window.onunhandledrejection = function(event) { log(`Unhandled Rejection: ${event.reason}`, 'error'); };
})();
</script>

<div class="webcam-hud">
    <div id="gestureIndicator" class="gesture-indicator">Kamera Memuat...</div>
    <video id="webcamVideo" autoplay playsinline muted></video>
    <canvas id="hudCanvas" width="200" height="150"></canvas>
</div>

<div class="game-container">
    <div class="info-panel">
        <div id="timer">Waktu: 120s</div>
        <div id="difficulty">Level: 1</div>
    </div>
    <div id="botIndicator" class="bot-indicator">🤖 BOT MODE</div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="messageOverlay" class="message-overlay">
        <div class="message-box">
            <h1>Survival</h1>
            <p>Bertahan selama 2 menit! Gunakan WASD atau Panah untuk bergerak.</p>

            <button id="startButton">Mulai Game</button>
        </div>
    </div>
</div>

<!-- Game Sound Tracks -->
<audio id="bgMusic" loop preload="auto">
    <source src="backsound_game.wav" type="audio/wav">
</audio>
<audio id="loseSfx" preload="auto">
    <source src="lose_sound.wav" type="audio/wav">
</audio>
<audio id="clickSfx" preload="auto">
    <source src="click_sound.wav" type="audio/wav">
</audio>
<audio id="gotHitSfx" preload="auto">
    <source src="got_hit.wav" type="audio/wav">
</audio>
<audio id="jumpSfx" preload="auto">
    <source src="jump.wav" type="audio/wav">
</audio>
<audio id="winSfx" preload="auto">
    <source src="win.mp3" type="audio/mpeg">
</audio>
<audio id="shieldSfx" preload="auto">
    <source src="shield.wav" type="audio/wav">
</audio>
<audio id="shieldHitSfx" preload="auto">
    <source src="shield_hit.wav" type="audio/wav">
</audio>

<!-- Externalized Logic Scripts -->
<script src="game.js" defer></script>
<script src="camera.js" defer></script>

</body>
</html>
